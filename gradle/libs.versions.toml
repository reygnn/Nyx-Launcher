# =============================================================================
# Kolibri Icons — Gradle Version Catalog
# Pins carried over 1:1 from Kolibri-Launcher (verified-green there). Keep the
# coupling notes in mind before bumping: AGP 9 + Hilt ≥2.59 + Gradle 9.x +
# KSP2 + Kotlin 2.3 move together; kotlin-test MUST equal `kotlin`; `material`
# MUST resolve before `appcompat` (force() in app/build.gradle.kts).
#
# minSdk = 36, compileSdk = targetSdk = 37, jvmToolchain = 21 live in the
# module build files, not here.
# =============================================================================

[versions]
# Build & Kotlin
agp = "9.4.0"                    # AGP 9.x line; provides built-in Kotlin.
kotlin = "2.3.21"               # kotlin-test must match exactly.
ksp = "2.3.11"                  # KSP2; tracks the kotlin 2.3.x minor line.

# Hilt
hilt = "2.60.1"                 # requires AGP ≥ 9.0 + Gradle ≥ 9.1.

# UI / Material
material = "1.14.0"            # DO NOT DOWNGRADE — must load before appcompat.
appcompat = "1.8.0"
core-ktx = "1.19.0"           # REQUIRES compileSdk 37.
core-splashscreen = "1.2.0"
activity = "1.13.0"
fragment = "1.8.9"           # fragment-ktx + fragment-testing share this.
recyclerview = "1.4.0"
viewpager2 = "1.1.0"

# Lifecycle & Navigation
lifecycle = "2.11.0"
navigation = "2.10.0"

# Data & Async
datastore = "1.2.1"
preference = "1.2.1"
coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"   # matched to Kotlin 2.3.21.

# Utilities
timber = "5.0.1"
acra = "5.13.1"              # DO NOT UPGRADE without re-syncing proguard-rules.pro.
leakcanary = "2.14"
json = "20260814"

# Test (JVM)
junit = "4.13.2"
core-testing = "2.2.0"
kotlin-test = "2.3.21"       # DO NOT DOWNGRADE — must match `kotlin`.
turbine = "1.2.1"
truth = "1.4.5"
robolectric = "4.16.1"
mockk = "1.14.11"

# AndroidX Test (keep runner/rules/core/junit in sync)
androidxTest = "1.7.0"
androidx-test-core = "1.7.0"
androidx-test-junit = "1.3.0"
espresso = "3.7.0"
orchestrator = "1.6.1"

[libraries]
# UI & Material
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "core-splashscreen" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-fragment-testing = { module = "androidx.fragment:fragment-testing", version.ref = "fragment" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }

# Lifecycle & Navigation
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-savedstate = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }

# Data & Async
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preference" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Utilities
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
acra-core = { module = "ch.acra:acra-core", version.ref = "acra" }
acra-http = { module = "ch.acra:acra-http", version.ref = "acra" }
leakcanary-android = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-core = { module = "com.google.dagger:hilt-core", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }

# Test (JVM)
junit = { module = "junit:junit", version.ref = "junit" }
androidx-arch-core-testing = { module = "androidx.arch.core:core-testing", version.ref = "core-testing" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin-test" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
json = { module = "org.json:json", version.ref = "json" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

# AndroidX Test
androidx-test-core-ktx = { module = "androidx.test:core-ktx", version.ref = "androidx-test-core" }
androidx-test-ext-junit-ktx = { module = "androidx.test.ext:junit-ktx", version.ref = "androidx-test-junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTest" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTest" }
androidx-test-orchestrator = { module = "androidx.test:orchestrator", version.ref = "orchestrator" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-test-espresso-contrib = { module = "androidx.test.espresso:espresso-contrib", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
